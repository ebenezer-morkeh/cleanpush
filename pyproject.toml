[project]
name = "cleanpush"
version = "0.2.0"
description = "AI agent that cleans code and updates docs before it lands on main"
requires-python = ">=3.10"
dependencies = ["anthropic[mcp]>=1.12", "mcp>=2.3", "ruff>=0.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cleanpush = "cleanpush.agent:main"
cleanpush-mcp = "cleanpush.repo_tools:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cleanpush"]

[tool.ruff]
line-length = 120
