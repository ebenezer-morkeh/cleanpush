# Runs cleanpush on every pull request into main and pushes the cleanup commit
# back to the PR branch, so whatever merges into main is already clean.
# Pair it with branch protection on main (require PRs + this check).
name: cleanpush
on:
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab; pick the branch to clean

permissions:
  contents: write

jobs:
  cleanpush:
    # manual runs always go; PR runs skip forks (no secrets) and the bot's own commit
    if: "github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cleanpush @ git+https://github.com/${{ github.repository_owner }}/cleanpush"
        # or: pip install cleanpush  (once published)
      - name: Run cleanpush
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cleanpush --base origin/main --commit
      - run: git push
